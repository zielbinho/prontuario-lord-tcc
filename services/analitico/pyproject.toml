[project]
name = "lord-analitico"
version = "0.1.0"
description = "Módulo analítico do prontuário LORD-UEPG: indicadores individuais e de coorte"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scipy>=1.13",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
figuras = ["matplotlib>=3.9"]
testes = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["analitico"]
