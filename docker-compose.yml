# Implantação no servidor da UEPG (seção 4.4.1 do TCC).
# Uso:  cp .env.exemplo .env   (preencher)   e   docker compose up -d --build
# Depois da primeira subida, baixe o modelo de linguagem (uma vez só, ~2 GB):
#   docker compose exec ollama ollama pull qwen2.5:3b
# Demonstração com dados sintéticos (nunca com dados reais):
#   docker compose exec api npx tsx src/demonstracao.ts
#
# Somente o proxy expõe portas. Banco, API e serviços ficam apenas na rede interna do Compose,
# e nenhum dado clínico sai do servidor: a IA também roda aqui.

services:
  banco:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lord
      POSTGRES_USER: lord_dono
      POSTGRES_PASSWORD: ${SENHA_DONO:?defina SENHA_DONO no .env}
    volumes:
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lord_dono -d lord"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      URL_BANCO: postgres://lord_app:${SENHA_PAPEL_APP}@banco:5432/lord
      URL_BANCO_ADMIN: postgres://lord_dono:${SENHA_DONO}@banco:5432/lord
      SENHA_PAPEL_APP: ${SENHA_PAPEL_APP:?}
      SENHA_PAPEL_ANALITICO: ${SENHA_PAPEL_ANALITICO:?}
      CHAVE_CRIPTOGRAFIA: ${CHAVE_CRIPTOGRAFIA:?}
      SEGREDO_PSEUDONIMO: ${SEGREDO_PSEUDONIMO:?}
      COOKIE_SEGURO: "true"
      URL_OLLAMA: http://ollama:11434
      MODELO_IA: ${MODELO_IA:-qwen2.5:3b}
      URL_TRANSCRICAO: http://transcricao:8765
      URL_ANALITICO: http://analitico:8766

  # Modelo de linguagem local (estruturação da anamnese)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - modelos-ollama:/root/.ollama

  # Transcrição de fala; o áudio fica só em memória
  transcricao:
    build:
      context: .
      dockerfile: services/transcricao/Dockerfile
    restart: unless-stopped
    environment:
      MODELO_WHISPER: ${MODELO_WHISPER:-small}
    volumes:
      - modelos-whisper:/modelos

  # Indicadores e estatística; só enxerga o esquema pseudonimizado
  analitico:
    build:
      context: .
      dockerfile: services/analitico/Dockerfile
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      URL_BANCO_ANALITICO: postgresql://lord_analitico:${SENHA_PAPEL_ANALITICO}@banco:5432/lord

  # HTTPS + interface web compilada
  proxy:
    build:
      context: .
      dockerfile: implantacao/Dockerfile.proxy
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?}
      MODO_TLS: ${MODO_TLS:-interno}
    volumes:
      - dados-caddy:/data

volumes:
  dados-banco:
  dados-caddy:
  modelos-ollama:
  modelos-whisper:
